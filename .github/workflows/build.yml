name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android --project-name home_cam --org com.myhomecam .

      - name: App name, permissions and lint
        run: |
          python3 - <<'PY'
          import os
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          s = s.replace('android:label="home_cam"',
                        'android:usesCleartextTraffic="true"\n        android:label="Home Cam"')
          perms = (
              '<uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
              '    <application'
          )
          if "permission.CAMERA" not in s:
              s = s.replace("<application", perms, 1)
          open(p, "w").write(s)
          g = "android/app/build.gradle.kts"
          if os.path.exists(g):
              block = "android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n"
          else:
              g = "android/app/build.gradle"
              block = "android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n"
          t = open(g).read()
          if "checkReleaseBuilds" not in t:
              t = t.replace("android {\n", block, 1)
          open(g, "w").write(t)
          PY

      - run: flutter pub get

      - name: Modernize mic_stream build file
        run: |
          python3 - <<'PY'
          import glob, re, os
          dirs = glob.glob(os.path.expanduser("~/.pub-cache/hosted/pub.dev/mic_stream-*/android"))
          if not dirs:
              print("mic_stream not found; skipping"); raise SystemExit(0)
          d = dirs[0]
          ns = "com.whatsub.mic_stream"
          man = os.path.join(d, "src/main/AndroidManifest.xml")
          if os.path.exists(man):
              t = open(man).read()
              m = re.search(r'package="([^"]+)"', t)
              if m:
                  ns = m.group(1)
              t = re.sub(r'\s*package="[^"]+"', '', t, count=1)
              open(man, "w").write(t)
          kotlin = os.path.isdir(os.path.join(d, "src/main/kotlin"))
          srcdir = "src/main/kotlin" if kotlin else "src/main/java"
          gradle = f"""group '{ns}'
          version '1.0'

          apply plugin: 'com.android.library'
          apply plugin: 'kotlin-android'

          android {{
              namespace '{ns}'
              compileSdk 34
              defaultConfig {{ minSdkVersion 21 }}
              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }}
              kotlinOptions {{ jvmTarget = '1.8' }}
              sourceSets {{ main.java.srcDirs += '{srcdir}' }}
          }}
          """
          # strip the common leading indentation introduced by the heredoc
          gradle = "\n".join(line[10:] if line.startswith(" " * 10) else line
                             for line in gradle.splitlines()) + "\n"
          open(os.path.join(d, "build.gradle"), "w").write(gradle)
          print("Patched mic_stream, namespace =", ns, "srcdir =", srcdir)
          PY

      - name: Generate app icon
        run: dart run flutter_launcher_icons
      - name: Use fixed signing key
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: HomeCam-v1.1-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk HomeCam.apk
          gh release delete home-cam-latest -y --cleanup-tag --repo ${{ github.repository }} || true
          gh release create home-cam-latest HomeCam.apk --repo ${{ github.repository }} --target ${{ github.sha }} --title "Home Cam (latest)" --notes "Tap HomeCam.apk below to download and install."
