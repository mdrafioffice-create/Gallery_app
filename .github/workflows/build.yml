name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android --project-name gallery_app --org com.mygallery .

      - name: Add permissions and app name
        run: |
          python3 - <<'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = (
              '<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n'
              '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n'
              '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n'
              '    <application android:requestLegacyExternalStorage="true"'
          )
          if "READ_MEDIA_IMAGES" not in s:
              s = s.replace("<application", perms, 1)
          s = s.replace('android:label="gallery_app"', 'android:label="My Gallery"')
          open(p, "w").write(s)
          print(s)

          # Turn off release lint (it crashes on a plugin, not our code)
          import os
          g = "android/app/build.gradle.kts"
          if os.path.exists(g):
              block = "android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n"
          else:
              g = "android/app/build.gradle"
              block = "android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n"
          t = open(g).read()
          if "checkReleaseBuilds" not in t:
              t = t.replace("android {\n", block, 1)
          open(g, "w").write(t)
          print(t)
          EOF

      - run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Use fixed signing key (so updates install over the old app)
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: MyGallery-v1.1-apk
          path: build/app/outputs/flutter-apk/app-release.apk
