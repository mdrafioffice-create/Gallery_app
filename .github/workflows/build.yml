name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android --project-name family_safety --org com.mysafety .

      - name: App name, permissions and lint
        run: |
          python3 - <<'PY'
          import os
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read().replace('android:label="family_safety"', 'android:label="Family Safety"')
          perms = (
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n'
              '    <queries>\n'
              '        <intent>\n'
              '            <action android:name="android.intent.action.VIEW"/>\n'
              '            <data android:scheme="sms"/>\n'
              '        </intent>\n'
              '        <intent>\n'
              '            <action android:name="android.intent.action.DIAL"/>\n'
              '            <data android:scheme="tel"/>\n'
              '        </intent>\n'
              '    </queries>\n'
              '    <application'
          )
          if "ACCESS_FINE_LOCATION" not in s:
              s = s.replace("<application", perms, 1)
          open(p, "w").write(s)
          g = "android/app/build.gradle.kts"
          if os.path.exists(g):
              block = "android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n"
          else:
              g = "android/app/build.gradle"
              block = "android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n"
          t = open(g).read()
          if "checkReleaseBuilds" not in t:
              t = t.replace("android {\n", block, 1)
          open(g, "w").write(t)
          PY

      - run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Use fixed signing key
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: FamilySafety-v1.0-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk FamilySafety.apk
          gh release delete child-safety-latest -y --cleanup-tag --repo ${{ github.repository }} || true
          gh release create child-safety-latest FamilySafety.apk --repo ${{ github.repository }} --target ${{ github.sha }} --title "Family Safety (latest)" --notes "Tap FamilySafety.apk below to download and install."
