name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android --project-name pixel_dash --org com.mygames .

      - name: App name and lint
        run: |
          python3 - <<'PY'
          import os
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read().replace('android:label="pixel_dash"', 'android:label="Pixel Dash"')
          open(p, "w").write(s)
          g = "android/app/build.gradle.kts"
          if os.path.exists(g):
              block = "android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n"
          else:
              g = "android/app/build.gradle"
              block = "android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n"
          t = open(g).read()
          if "checkReleaseBuilds" not in t:
              t = t.replace("android {\n", block, 1)
          open(g, "w").write(t)
          PY

      - run: flutter pub get
      - name: Generate app icon
        run: dart run flutter_launcher_icons
      - name: Use fixed signing key
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PixelDash-v1.0-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk PixelDash.apk
          gh release delete pixel-dash-latest -y --cleanup-tag --repo ${{ github.repository }} || true
          gh release create pixel-dash-latest PixelDash.apk --repo ${{ github.repository }} --target ${{ github.sha }} --title "Pixel Dash (latest)" --notes "Tap PixelDash.apk below to download and install. Play in landscape."
