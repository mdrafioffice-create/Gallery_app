name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create --platforms=android --project-name road_rush --org com.mygames .

      - name: Set app name and turn off release lint
        run: |
          python3 - <<'PY'
          import os
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read().replace('android:label="road_rush"', 'android:label="Road Rush"')
          open(p, "w").write(s)
          g = "android/app/build.gradle.kts"
          if os.path.exists(g):
              block = "android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n"
          else:
              g = "android/app/build.gradle"
              block = "android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n"
          t = open(g).read()
          if "checkReleaseBuilds" not in t:
              t = t.replace("android {\n", block, 1)
          open(g, "w").write(t)
          PY

      - run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons

      - name: Use fixed signing key (so updates install over the old app)
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: RoadRush-v1.1-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as a release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk RoadRush.apk
          gh release delete car-racing-latest -y --cleanup-tag --repo ${{ github.repository }} || true
          gh release create car-racing-latest RoadRush.apk --repo ${{ github.repository }} --target ${{ github.sha }} --title "Road Rush (latest)" --notes "Tap RoadRush.apk below to download and install."
