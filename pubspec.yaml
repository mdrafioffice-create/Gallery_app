name: road_rush
description: Road Rush - a top-down car racing game.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  just_audio: ^0.9.42

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#455A64"
  adaptive_icon_foreground: "assets/icon_foreground.png"
