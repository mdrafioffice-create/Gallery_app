name: family_safety
description: Family Safety - a transparent child-safety app (SOS, check-in, safe walk).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  url_launcher: ^6.3.1

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#00897B"
  adaptive_icon_foreground: "assets/icon_foreground.png"
