name: home_cam
description: Home Cam - use a spare phone as a WiFi home camera.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  image: ^4.3.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  mic_stream: ^0.7.2
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#263238"
  adaptive_icon_foreground: "assets/icon_foreground.png"
