name: road_rush
description: Road Rush - a pseudo-3D arcade car racing game.
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  sensors_plus: ^6.1.1

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1A237E"
  adaptive_icon_foreground: "assets/icon_foreground.png"
